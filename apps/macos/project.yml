# XcodeGen spec for the ReplayNES macOS frontend.
#   cd apps/macos && xcodegen generate   (scripts/build-macos.sh does this for you)
# The engine is NOT compiled here: the "Engine" aggregate target runs CMake on the same
# source list as every other platform (single source of truth) and the app links the
# resulting static libraries.
name: ReplayNES
options:
  bundleIdPrefix: io.github.replaynes
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # English is the development language; Japanese comes from the String Catalogs
  # (Resources/Localizable.xcstrings, Resources/InfoPlist.xcstrings). The UI follows the system
  # language: Japanese when it is preferred, English otherwise.
  developmentLanguage: en
packages:
  # Auto-update framework (MIT-style license; see THIRD_PARTY_NOTICES.md). Pinned for
  # reproducible release builds; its bin/ tools (generate_keys, sign_update) are used by
  # scripts/release.sh from the resolved SPM artifacts.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "4"
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    RN_ENGINE_BUILD_DIR: "$(SRCROOT)/../../build/xcode-engine"
    HEADER_SEARCH_PATHS:
      - "$(SRCROOT)/../../engine/include/replaynes"
      - "$(SRCROOT)/Sources/Core/C"
    SWIFT_OBJC_BRIDGING_HEADER: "Sources/Core/C/Bridging.h"
    LIBRARY_SEARCH_PATHS:
      - "$(RN_ENGINE_BUILD_DIR)"
      - "$(RN_ENGINE_BUILD_DIR)/engine"
    OTHER_LDFLAGS: ["-lreplaynes_engine", "-lnestopia_core", "-lc++"]
    GCC_C_LANGUAGE_STANDARD: c11

aggregateTargets:
  Engine:
    buildScripts:
      - name: Build ReplayNES engine (CMake)
        script: '"$SRCROOT/Scripts/build-engine.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - "$(RN_ENGINE_BUILD_DIR)/engine/libreplaynes_engine.a"
          - "$(RN_ENGINE_BUILD_DIR)/libnestopia_core.a"

targets:

  # Syphon (BSD license; see THIRD_PARTY_NOTICES.md): streams the game picture to OBS & co.
  # ("Syphon Client" source). Built from the pinned submodule third_party/syphon with the
  # upstream build settings, except that SyphonServerRendererMetal.m is replaced by
  # SyphonSupport/SyphonServerRendererMetal.m, which compiles the upstream shader at runtime so
  # the build does not need the optional offline Metal toolchain. The submodule is unmodified.
  Syphon:
    type: framework
    platform: macOS
    sources:
      - path: ../../third_party/syphon
        headerVisibility: project
        excludes:
          - ".git"
          - "*.xcodeproj"
          - "Syphon.docc"
          - "en.lproj"
          - "*.icns"
          - "*.rtf"
          - "*.txt"
          - "*.md"
          - "*.plist"
          - "*.exp"
          - "*.modulemap"
          - "*.pch"
          - "SyphonMetalShaders.metal"
          - "SyphonServerRendererMetal.m"
          - "Syphon.h"
          - "SyphonClient.h"
          - "SyphonClientBase.h"
          - "SyphonImage.h"
          - "SyphonImageBase.h"
          - "SyphonMetalClient.h"
          - "SyphonMetalServer.h"
          - "SyphonOpenGLClient.h"
          - "SyphonOpenGLImage.h"
          - "SyphonOpenGLServer.h"
          - "SyphonServer.h"
          - "SyphonServerBase.h"
          - "SyphonServerDirectory.h"
          - "SyphonSubclassing.h"
      - path: ../../third_party/syphon/Syphon.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonClient.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonClientBase.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonImage.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonImageBase.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonMetalClient.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonMetalServer.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonOpenGLClient.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonOpenGLImage.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonOpenGLServer.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonServer.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonServerBase.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonServerDirectory.h
        headerVisibility: public
      - path: ../../third_party/syphon/SyphonSubclassing.h
        headerVisibility: public
      - path: SyphonSupport
    dependencies:
      - sdk: Metal.framework
      - sdk: IOSurface.framework
      - sdk: OpenGL.framework
      - sdk: Cocoa.framework
    settings:
      base:
        PRODUCT_NAME: Syphon
        PRODUCT_BUNDLE_IDENTIFIER: info.v002.Syphon
        INFOPLIST_FILE: ../../third_party/syphon/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        DEFINES_MODULE: YES
        MODULEMAP_FILE: ../../third_party/syphon/Syphon.modulemap
        EXPORTED_SYMBOLS_FILE: ../../third_party/syphon/Exported_Symbols.exp
        GCC_PREFIX_HEADER: ../../third_party/syphon/Syphon_Prefix.pch
        GCC_PRECOMPILE_PREFIX_HEADER: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "SYPHON_CORE_SHARE"]
        CLANG_ENABLE_OBJC_ARC: YES
        CLANG_ENABLE_MODULES: YES
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        DYLIB_COMPATIBILITY_VERSION: "1"
        DYLIB_CURRENT_VERSION: "1"
        FRAMEWORK_VERSION: A
        SKIP_INSTALL: YES
        # Upstream code; keep its warnings out of the app build log.
        GCC_WARN_INHIBIT_ALL_WARNINGS: YES
        HEADER_SEARCH_PATHS: ["$(SRCROOT)/../../third_party/syphon"]
        OTHER_CFLAGS: ["$(inherited)", "--embed-dir=$(SRCROOT)/../../third_party/syphon"]
        # Do not inherit the app's engine link flags / bridging header.
        OTHER_LDFLAGS: []
        LIBRARY_SEARCH_PATHS: []
        SWIFT_OBJC_BRIDGING_HEADER: ""

  ReplayNES:
    type: application
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Sources/App
      - path: Resources/Assets.xcassets
      - path: Resources/Localizable.xcstrings
      - path: Resources/InfoPlist.xcstrings
    dependencies:
      - target: Engine
      - package: Sparkle
      - target: Syphon
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.replaynes.ReplayNES
        PRODUCT_NAME: ReplayNES
        PRODUCT_MODULE_NAME: ReplayNESApp
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.games
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: ReplayNES
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ja]
        LSApplicationCategoryType: public.app-category.games
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: "ReplayNES - GPL-2.0-or-later. Includes Nestopia UE (GPL-2.0-or-later)."
        NSSupportsAutomaticGraphicsSwitching: true
        GCSupportsControllerUserInteraction: true
        # Sparkle auto-update. The feed is the appcast.xml asset of the latest GitHub release
        # (scripts/release.sh). SUEnableAutomaticChecks is deliberately unset so Sparkle asks the
        # user for permission before the first automatic check; no system profile is sent.
        SUFeedURL: https://github.com/kathoc/ReplayNES/releases/latest/download/appcast.xml
        SUPublicEDKey: epSlR4TX073wn6yhEigPygjpRMr2K39iu9ZbQg3OPgQ=
        SUEnableSystemProfiling: false
        GCSupportedGameControllers:
          - ProfileName: ExtendedGamepad
          - ProfileName: MicroGamepad
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: io.github.replaynes.nesrec
            UTTypeDescription: ReplayNES Project
            UTTypeConformsTo: [com.apple.package, public.composite-content]
            UTTypeTagSpecification:
              public.filename-extension: [nesrec]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: io.github.replaynes.nes-rom
            UTTypeDescription: NES ROM
            UTTypeConformsTo: [public.data]
            UTTypeTagSpecification:
              public.filename-extension: [nes, NES]
        CFBundleDocumentTypes:
          - CFBundleTypeName: ReplayNES Project
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSTypeIsPackage: true
            LSItemContentTypes: [io.github.replaynes.nesrec]
          - CFBundleTypeName: NES ROM
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [io.github.replaynes.nes-rom]

  ReplayNESTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Sources/Core
      - path: Tests
    dependencies:
      - target: Engine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.replaynes.ReplayNESTests
        PRODUCT_MODULE_NAME: ReplayNESTests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ReplayNES:
    build:
      targets:
        ReplayNES: all
        ReplayNESTests: [test]
    test:
      targets: [ReplayNESTests]
    run:
      config: Debug
    archive:
      config: Release
