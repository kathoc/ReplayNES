// The app: SDL's Java glue (third_party/SDL/android-project, the same SDL as the native library) and
// the native part (../CMakeLists.txt: SDL3, the engine, the desktop frontend, the Vulkan renderer).
// Product: -PrnProductFile=<product.cmake> -PrnApplicationId=<id> -PrnAppName=<name> (default ReplayNES).
plugins {
    id 'com.android.application'
}

def productFile = project.findProperty('rnProductFile') ?: ''
def appId = project.findProperty('rnApplicationId') ?: 'io.github.replaynes.android'
def appName = project.findProperty('rnAppName') ?: 'ReplayNES'
def sdlJava = "${rootDir}/../../third_party/SDL/android-project/app/src/main/java"
// The launcher icon: -PrnIcon=<a square PNG> (the product's; default ReplayNES's), as a mipmap.
def iconPng = file(project.findProperty('rnIcon') ?: "${rootDir}/../../apps/linux/steam/artwork/png/hicolor/512.png")
def iconRes = layout.buildDirectory.dir('generated/rn-icon/res')
// The version: -PrnVersion=<major.minor.patch> (the product's); versionCode major * 10000 + minor * 100 + patch.
def rnVersionName = (project.findProperty('rnVersion') ?: '0.1.0').toString()
def vparts = (rnVersionName.tokenize('.') + ['0', '0', '0']).take(3).collect { it.toInteger() }
// Release signing from the environment (scripts/build-android.sh reads it from the user's config; never
// in the repository): RN_ANDROID_KEYSTORE, RN_ANDROID_KEYSTORE_PASSWORD, RN_ANDROID_KEY_ALIAS,
// RN_ANDROID_KEY_PASSWORD. Without them a release build is unsigned.
def keystore = System.getenv('RN_ANDROID_KEYSTORE')

android {
    namespace = 'io.github.replaynes.android'
    compileSdk = 36
    ndkVersion = '30.0.16248370'
    defaultConfig {
        applicationId = appId
        minSdk = 29          // Vulkan 1.1 on every 64-bit device that has Vulkan
        targetSdk = 36
        versionCode = vparts[0] * 10000 + vparts[1] * 100 + vparts[2]
        versionName = rnVersionName
        resValue 'string', 'app_name', appName
        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_shared', "-DRN_PRODUCT_FILE=${productFile}"
                abiFilters 'arm64-v8a'
            }
        }
        ndk { abiFilters 'arm64-v8a' }
    }
    signingConfigs {
        if (keystore) {
            release {
                storeFile = file(keystore)
                storePassword = System.getenv('RN_ANDROID_KEYSTORE_PASSWORD')
                keyAlias = System.getenv('RN_ANDROID_KEY_ALIAS')
                keyPassword = System.getenv('RN_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            // The emulation is far too slow unoptimized (as on iOS): native code is always Release.
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } }
        }
        release {
            minifyEnabled false
            if (keystore) signingConfig = signingConfigs.release
        }
    }
    buildFeatures { resValues = true }  // app_name from the product
    sourceSets.main.java.srcDirs += [sdlJava]
    sourceSets.main.res.srcDirs += [iconRes]
    externalNativeBuild {
        cmake {
            path '../CMakeLists.txt'
            version '4.1.2'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    lint { abortOnError = false }
}

// The icon into a generated resource folder before the resources are merged.
def rnIcon = tasks.register('rnIcon', Copy) {
    from(iconPng) { rename { 'ic_launcher.png' } }
    into(iconRes.map { it.dir('mipmap-xxxhdpi') })
    inputs.property('icon', iconPng.absolutePath)
}
tasks.named('preBuild') { dependsOn rnIcon }
